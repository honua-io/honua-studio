name: Qualify the customer Compose stack

# Shared by live-demo-smoke.yml and the armed path of live-candidate-journeys.yml.
# A reusable workflow does not inherit the caller's env.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact that holds this run's qualification evidence
        required: true
        type: string
      candidate_sha:
        description: When set, refuse to qualify unless the pinned server revision is this SHA
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"

jobs:
  qualify:
    name: Qualify the customer Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Require the pinned image revision for this SHA
        if: ${{ inputs.candidate_sha != '' }}
        env:
          HONUA_CANDIDATE_JOURNEYS: "on"
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          mkdir -p .tmp
          node scripts/live-candidate-row.mjs "$CANDIDATE_SHA" > .tmp/candidate-journey-row.json
          cat .tmp/candidate-journey-row.json

      - name: Check qualification inputs
        id: images
        env:
          HONUA_LIVE_ANTHROPIC_API_KEY: ${{ secrets.HONUA_LIVE_ANTHROPIC_API_KEY }}
        run: node scripts/live-compose-stack.mjs check

      - name: Read the customer quickstart at the image revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: honua-io/honua-server
          ref: ${{ steps.images.outputs.server_revision }}
          path: .tmp/live-server-source
          persist-credentials: false

      - name: Read the Console viewer at the image revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: honua-io/honua-console
          ref: ${{ steps.images.outputs.console_revision }}
          path: .tmp/live-console-source
          persist-credentials: false

      - name: Install browser dependencies and validate harness
        run: |
          npm ci
          npm run test:browser:install
          node --test scripts/__tests__/live-candidate-row.test.mjs scripts/__tests__/live-compose.test.mjs scripts/__tests__/live-compose-stack.test.mjs scripts/__tests__/live-journey-contract.test.mjs scripts/__tests__/live-model-guard.test.mjs scripts/__tests__/live-diagnostics.test.mjs scripts/__tests__/live-realtime-proxy.test.mjs
          node --test scripts/__tests__/live-publication.test.mjs

      - name: Prepare the customer quickstart and dedicated test person
        env:
          HONUA_LIVE_ANTHROPIC_API_KEY: ${{ secrets.HONUA_LIVE_ANTHROPIC_API_KEY }}
        run: |
          echo '127.0.0.1 host.docker.internal' | sudo tee -a /etc/hosts >/dev/null
          node scripts/live-compose-stack.mjs prepare

      - name: Start the customer stack and record runtime identity
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.tmp/live-compose/identity/certs/kc.crt
        run: node scripts/live-compose-stack.mjs start

      - name: Record configured provider readiness
        run: node scripts/live-demo-readiness.mjs

      - name: Qualify Studio against the customer stack without retries
        timeout-minutes: 10
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .tmp/live-studio-report.json
        run: exec node scripts/qualify-live-compose.mjs

      - name: Collect redacted diagnostics before teardown
        if: ${{ always() && steps.images.outcome == 'success' }}
        timeout-minutes: 2
        run: node scripts/live-compose-stack.mjs diagnostics

      - name: Upload qualification evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            .tmp/candidate-journey-row.json
            .tmp/live-compose-identity.json
            .tmp/live-readiness.json
            .tmp/live-studio-report.json
            .tmp/live-model-usage.json
            .tmp/live-diagnostics/
          if-no-files-found: error

      - name: Stop only this run's customer stack
        if: ${{ always() && steps.images.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if test -f .tmp/live-compose/compose.studio.json; then
            node scripts/live-compose-stack.mjs stop
          fi
