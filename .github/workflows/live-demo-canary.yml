name: Demo Studio canary

on:
  schedule:
    - cron: "41 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: demo-studio-canary
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.3"
  HONUA_LIVE_BASE_URL: "https://demo.honua.io/api"

jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run test:browser:install

      - name: Record live provider readiness without invoking a model
        env:
          HONUA_LIVE_API_KEY: ${{ secrets.HONUA_LIVE_API_KEY }}
          HONUA_LIVE_CONSOLE_URL: ${{ vars.HONUA_LIVE_CONSOLE_URL }}
          HONUA_LIVE_CONSOLE_PROFILE_ID: ${{ vars.HONUA_LIVE_CONSOLE_PROFILE_ID }}
          HONUA_LIVE_APPROVER_IDP_ORIGIN: ${{ vars.HONUA_LIVE_APPROVER_IDP_ORIGIN }}
          HONUA_LIVE_APPROVER_USERNAME: ${{ secrets.HONUA_LIVE_APPROVER_USERNAME }}
          HONUA_LIVE_APPROVER_PASSWORD: ${{ secrets.HONUA_LIVE_APPROVER_PASSWORD }}
        run: node scripts/live-demo-readiness.mjs

      - name: Run Studio journeys against the live AWS demo
        if: ${{ !cancelled() }}
        env:
          HONUA_LIVE_API_KEY: ${{ secrets.HONUA_LIVE_API_KEY }}
          HONUA_LIVE_CONSOLE_URL: ${{ vars.HONUA_LIVE_CONSOLE_URL }}
          HONUA_LIVE_CONSOLE_PROFILE_ID: ${{ vars.HONUA_LIVE_CONSOLE_PROFILE_ID }}
          HONUA_LIVE_APPROVER_IDP_ORIGIN: ${{ vars.HONUA_LIVE_APPROVER_IDP_ORIGIN }}
          HONUA_LIVE_APPROVER_USERNAME: ${{ secrets.HONUA_LIVE_APPROVER_USERNAME }}
          HONUA_LIVE_APPROVER_PASSWORD: ${{ secrets.HONUA_LIVE_APPROVER_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: .tmp/live-studio-report.json
        run: npm run test:browser:live -- --reporter=list,json --retries=0

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-studio-canary
          path: |
            .tmp/live-readiness.json
            .tmp/live-studio-report.json
          if-no-files-found: error

      - name: Upload failed journey screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-studio-canary-failures
          path: |
            .tmp/playwright-output/**/error-context.md
            .tmp/playwright-output/**/*.png
          if-no-files-found: ignore
