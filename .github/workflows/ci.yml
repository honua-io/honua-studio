name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"
  DOTNET_VERSION: "10.0.x"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  check:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome check (lint + format)
        run: npm run check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  container-smoke:
    name: Static container and runtime config smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build twice from the commit epoch and verify the retry fingerprint
        run: |
          set -euo pipefail
          source_epoch=$(git show -s --format=%ct HEAD)
          for image in honua-studio-ci honua-studio-ci-retry; do
            docker build --no-cache --provenance=false \
              --build-arg "SOURCE_DATE_EPOCH=$source_epoch" \
              -t "$image" .
          done
          fingerprint() {
            docker image inspect "$1" --format '{{json .RootFS.Layers}} {{json .Config}}' \
              | sha256sum | cut -d ' ' -f 1
          }
          first=$(fingerprint honua-studio-ci)
          retry=$(fingerprint honua-studio-ci-retry)
          if [[ "$first" != "$retry" ]]; then
            echo "Clean container rebuild changed the occupied-coordinate fingerprint" >&2
            exit 1
          fi

      - name: Boot as non-root with runtime config
        run: |
          docker run --rm -d --name honua-studio-ci -p 18080:8080 \
            -e HONUA_SERVER_BASE_URL=https://honua.example \
            -e 'HONUA_OIDC_CLIENT_ID=studio-"quoted"-\tenant' \
            -e HONUA_MODEL_PROVIDER=fixture-provider \
            honua-studio-ci
          trap 'docker stop honua-studio-ci' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:18080/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/config.json > /tmp/honua-studio-config.json
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("/tmp/honua-studio-config.json","utf8")); if(c.serverBaseUrl!=="https://honua.example"||c.oidc.clientId!==`studio-"quoted"-\\tenant`) process.exit(1)'
          test "$(docker inspect -f '{{.Config.User}}' honua-studio-ci)" != "root"

  browser-smoke:
    name: Browser smoke (mock + live dev modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npm run test:browser:install

      - name: Browser boot smoke (builds first)
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: .tmp/playwright-output
          if-no-files-found: ignore

  blazor-host-smoke:
    name: Blazor Web App test host smoke (honua-io/honua-studio#5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npm run test:browser:install

      - name: Build Studio bundle + Blazor host (scoped — never the whole solution/tree)
        run: npm run build:blazor-host

      - name: Blazor host hazard smoke
        run: npx playwright test --grep @blazor

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-blazor-host
          path: .tmp/playwright-output
          if-no-files-found: ignore
