name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  release:
    name: Static bundle and container
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build and archive static bundle
        run: |
          npm ci
          npm run build
          tar -C dist -czf honua-studio-static.tgz .

      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) echo "Release tag must start with v" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_TAG#v}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$RELEASE_TAG" -t "$image" -t "ghcr.io/${GITHUB_REPOSITORY}:2026.1" .
          docker push "$image"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:2026.1"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" honua-studio-static.tgz --clobber
