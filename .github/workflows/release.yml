name: Release Studio bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed release tag to package
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/honua-io/honua-studio

jobs:
  # security.yml does not run on tags. These pinned scans are the release gate,
  # so a v* publish cannot skip them. honua-io/.github main is e26b67e9.
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: honua-io/.github/.github/workflows/reusable-trivy.yml@e26b67e904f2c23796fe677d267d73188a764545 # main
    with:
      scan-type: fs

  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: honua-io/.github/.github/workflows/reusable-scorecard.yml@e26b67e904f2c23796fe677d267d73188a764545 # main

  # Run the same smoke suite on the release revision before publishing its image
  # (honua-io/honua-server#4428). Hosted demo and real-model lanes are not part
  # of this Preview gate; live-demo-smoke.yml keeps that concurrency group.
  smokes:
    name: Smoke suite
    # Deliberately passes no ref: the suite checks out the ref that triggered
    # this run, and the guard below refuses any dispatch that would package a
    # different revision. Handing it a caller-supplied ref instead would check
    # out untrusted code where it can poison the default branch's cache.
    uses: ./.github/workflows/smoke-suite.yml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: [smokes, trivy, scorecard]
    permissions:
      contents: write
      packages: write
    steps:
      # A tag push always satisfies this. A workflow_dispatch does only when it
      # was launched from the tag it names, which is what makes "the smokes ran
      # against the revision being published" true by construction:
      #   gh workflow run release.yml --ref vX.Y.Z -f version=vX.Y.Z
      - name: Refuse to package a revision the smokes did not run against
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          FULL_REF: ${{ github.ref }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Releases must run from an existing v-prefixed tag, not a branch."
            exit 1
          fi
          if [ -n "$REQUESTED_VERSION" ] && [ "$FULL_REF" != "refs/tags/$REQUESTED_VERSION" ]; then
            echo "::error::The requested version must match this run's full tag ref."
            exit 1
          fi
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$REF_NAME" ]; then
            # Workflow commands are read from stdout, so this annotation must not go to stderr.
            echo "::error::Dispatch asked for '$REQUESTED_VERSION' but this run is on '$REF_NAME'. The smoke suite ran against '$REF_NAME', so publishing '$REQUESTED_VERSION' would push an unsmoked image. Re-run from the tag: gh workflow run release.yml --ref $REQUESTED_VERSION -f version=$REQUESTED_VERSION"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Bind to the event commit used by the smoke suite, even if a tag moves.
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run check && npm run typecheck && npm test && npm run build

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REQUESTED_VERSION:-$REF_NAME}"
          case "$version" in v*) ;; *) echo "version must start with v" >&2; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build reproducible static bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -czf "honua-studio-${VERSION}.tar.gz" -C dist .
          sha256sum "honua-studio-${VERSION}.tar.gz" > "honua-studio-${VERSION}.tar.gz.sha256"
        shell: bash

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build, verify, and push the release image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "org.opencontainers.image.version=$VERSION" -t "$IMAGE:$VERSION" .
          # Push only this tag. The smoke suite already passed on github.sha;
          # these checks bind the runtime-config gate to the image bytes below.
          docker run --rm -d --name honua-studio-release --read-only \
            --tmpfs /var/cache/nginx:uid=101,gid=101 --tmpfs /var/run:uid=101,gid=101 \
            -p 18081:8080 \
            --mount type=bind,src="$PWD/deploy/config.example.json",dst=/usr/share/nginx/html/config.json,readonly \
            "$IMAGE:$VERSION"
          trap 'docker stop honua-studio-release >/dev/null 2>&1 || true' EXIT
          curl --retry 10 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:18081/config.json | jq -e '.schemaVersion == "honua.studio.runtime-config.v1"'
          curl --retry 10 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:18081/a/deep/spa/route | grep -q '<!doctype html>'
          docker stop honua-studio-release >/dev/null 2>&1 || true
          docker push "$IMAGE:$VERSION"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Emit release receipt
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          jq -n --arg version "$VERSION" --arg sourceSha "$SOURCE_SHA" --arg image "$IMAGE@$IMAGE_DIGEST" \
            '{schemaVersion:"honua.studio.release-receipt.v1",version:$version,sourceSha:$sourceSha,image:$image}' > "honua-studio-${VERSION}.receipt.json"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --verify-tag --generate-notes
          gh release upload "$VERSION" "honua-studio-${VERSION}.tar.gz" "honua-studio-${VERSION}.tar.gz.sha256" "honua-studio-${VERSION}.receipt.json" --clobber
