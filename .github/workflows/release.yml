name: Release Studio bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed release tag to package
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/honua-io/honua-studio
  HONUA_LIVE_BASE_URL: "https://demo.honua.io/api"

jobs:
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: honua-io/.github/.github/workflows/reusable-trivy.yml@e26b67e904f2c23796fe677d267d73188a764545 # main
    with:
      scan-type: fs

  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: honua-io/.github/.github/workflows/reusable-scorecard.yml@e26b67e904f2c23796fe677d267d73188a764545 # main

  preview-qualification:
    name: Preview container, runtime config, and GA-server smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci && npm run build
      - run: docker build -t honua-studio:release-candidate .

      - name: Verify runtime configuration on the candidate image
        run: |
          docker run --rm -d --name honua-studio-release-candidate --read-only \
            --tmpfs /var/cache/nginx:uid=101,gid=101 --tmpfs /var/run:uid=101,gid=101 \
            -p 18081:8080 \
            --mount type=bind,src="$PWD/deploy/config.example.json",dst=/usr/share/nginx/html/config.json,readonly \
            honua-studio:release-candidate
          trap 'docker stop honua-studio-release-candidate >/dev/null 2>&1 || true' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:18081/config.json | jq -e '.schemaVersion == "honua.studio.runtime-config.v1"'
          curl --fail http://127.0.0.1:18081/a/deep/spa/route | grep -q '<!doctype html>'

      - name: Require GA-server smoke credentials
        env:
          HONUA_LIVE_API_KEY: ${{ secrets.HONUA_LIVE_API_KEY }}
        run: test -n "$HONUA_LIVE_API_KEY"

      - name: Install Playwright Chromium
        run: npm run test:browser:install

      - name: Exercise the candidate against the GA server
        env:
          HONUA_LIVE_API_KEY: ${{ secrets.HONUA_LIVE_API_KEY }}
        run: npm run test:browser:live

  release:
    needs: [trivy, scorecard, preview-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run check && npm run typecheck && npm test && npm run build

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REQUESTED_VERSION:-$REF_NAME}"
          case "$version" in v*) ;; *) echo "version must start with v" >&2; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build reproducible static bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -czf "honua-studio-${VERSION}.tar.gz" -C dist .
          sha256sum "honua-studio-${VERSION}.tar.gz" > "honua-studio-${VERSION}.tar.gz.sha256"
        shell: bash

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push versioned image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "org.opencontainers.image.version=$VERSION" -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Emit release receipt
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          jq -n --arg version "$VERSION" --arg sourceSha "$SOURCE_SHA" --arg image "$IMAGE@$IMAGE_DIGEST" \
            '{schemaVersion:"honua.studio.release-receipt.v1",version:$version,sourceSha:$sourceSha,image:$image}' > "honua-studio-${VERSION}.receipt.json"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --verify-tag --generate-notes
          gh release upload "$VERSION" "honua-studio-${VERSION}.tar.gz" "honua-studio-${VERSION}.tar.gz.sha256" "honua-studio-${VERSION}.receipt.json" --clobber
