name: PR issue disposition

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request whose current metadata must be validated
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-issue-disposition-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  issue-disposition:
    name: PR Issue Disposition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This PR-associated job is the merge check. It deliberately executes the
      # protected base revision's validator, never head code: a pull request
      # that edited the validator could otherwise pass itself.
      - name: Check out trusted policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      # Bootstrap only: a base revision that predates the validator has none to
      # run, and skipping the gate there would let those pull requests merge
      # unchecked. No pull request can induce this — the base is always the
      # protected default branch — and it stops firing once the validator is on
      # `main`. Head code runs only when trusted code does not exist.
      - name: Check out the pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: head-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Select the policy revision
        id: policy
        run: |
          set -euo pipefail
          if [[ -f trusted-policy/scripts/check-pr-issue-disposition.mjs ]]; then
            echo "directory=trusted-policy" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Base revision carries no validator; falling back to the pull-request head."
            echo "directory=head-policy" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"

      - name: Validate current issue disposition
        working-directory: ${{ steps.policy.outputs.directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/check-pr-issue-disposition.mjs
          else
            node scripts/check-pr-issue-disposition.mjs \
              --repository "${{ github.repository }}" \
              --pull-request "${{ inputs.pull_request_number }}"
          fi
